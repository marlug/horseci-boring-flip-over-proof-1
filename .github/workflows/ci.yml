name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Cache something
        uses: actions/cache@v4
        with:
          path: my-cache-dir
          key: my-cache-key-${{ github.run_id }}-${{ matrix.go-version }}
          restore-keys: |
            my-cache-key-

      - name: Write cache and artifact
        run: |
          mkdir -p my-cache-dir
          echo "Boring cache content for ${{ matrix.go-version }}" > my-cache-dir/content.txt
          echo "Hello from the boring proof rerun. Matrix: ${{ matrix.go-version }}"
          mkdir -p artifacts
          echo "Artifact content" > artifacts/result-${{ matrix.go-version }}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.go-version }}
          path: artifacts/
